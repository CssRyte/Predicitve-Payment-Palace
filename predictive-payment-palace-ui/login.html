<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8">
  <meta content="width=device-width,initial-scale=1" name="viewport">
  <title>
   Login | Predictive Payment Palace
  </title>
  <link href="css/styles.css" rel="stylesheet">
 </head>
 <body>
  <main class="login-shell">
   <section class="login-card">
    <div class="brand">
     <div class="brand-mark">
      P
     </div>
     <span>
      Predictive Payment Palace
     </span>
    </div>
    <p class="muted">
     Predict smarter. Waste less. Grow your business.
    </p>
    <form action="prep.html" class="form-grid">
     <div class="field">
      <label>
       Email or username
      </label>
      <input class="input" placeholder="owner@example.com" required type="email">
     </div>
     <div class="field">
      <label>
       Password
      </label>
      <input class="input" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required type="password">
     </div>
     <div class="inline small">
      <input id="remember" type="checkbox">
      <label for="remember">
       Remember me
      </label>
      <a href="#" style="margin-left:auto;color:var(--primary)">
       Forgot password?
      </a>
     </div>
     <button class="btn btn-primary btn-block">
      Sign In
     </button>
    </form>
    <p class="small muted" style="text-align:center">
     Need access? Contact your administrator.
    </p>
   </section>
   <section class="info-card">
    <div class="hero-illustration">
     🍽️
    </div>
    <h2>
     Built for Lakewood businesses
    </h2>
    <div class="benefits">
     <div>
      Reduce food waste
     </div>
     <div>
      Prepare the right amount
     </div>
     <div>
      Understand sales patterns
     </div>
     <div>
      Make clearer reorder decisions
     </div>
    </div>
   </section>
  </main>
 </body>
</html>
